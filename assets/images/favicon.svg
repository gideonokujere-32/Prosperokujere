<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a3a3"/>
      <stop offset="55%" stop-color="#008080"/>
      <stop offset="100%" stop-color="#004d4d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#002b2b" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#tealGrad)"/>
  <!-- Elegant Gold Ring -->
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.85"/>
  <!-- Latin Cross with Golden Ratio Proportions -->
  <g filter="url(#glow)">
    <!-- Vertical Beam -->
    <rect x="28.5" y="15" width="7" height="34" rx="2" fill="#ffffff"/>
    <!-- Horizontal Crossbeam -->
    <rect x="19" y="24" width="26" height="7" rx="2" fill="#ffffff"/>
  </g>
</svg>
